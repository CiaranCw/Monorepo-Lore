# Generates Go types from the verbatim Lore 0.10.1 protos in proto/ (see proto/SOURCE_SHA256.txt).
# Install protoc-gen-go v1.31.0 and protoc-gen-go-grpc v1.3.0 and put them on PATH.
version: v1
managed:
  enabled: true
  go_package_prefix:
    default: lore-monorepo/gen
plugins:
  - plugin: go
    path: protoc-gen-go
    out: gen
    opt: paths=source_relative
  - plugin: go-grpc
    path: protoc-gen-go-grpc
    out: gen
    opt: paths=source_relative
