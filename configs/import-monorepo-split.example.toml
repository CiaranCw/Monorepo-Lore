# Parseable external Git Monorepo split manifest.
# Source subdirectories under the same source_url must not overlap.
# Strict mode blocks the import until every root/global source path matches a
# reviewed path_rules classification below.

project = "ExampleGamesProject"
conflict_policy = "fail"
concurrency = 2
global_files_policy = "strict"

[[path_rules]]
pattern = "README.md"
category = "excluded"
reason = "Source-host landing page retained in the Git mirror and migration evidence"

[[path_rules]]
pattern = ".github/**"
category = "excluded"
reason = "Source-host CI configuration is not runtime game-module content"

[[path_rules]]
pattern = "shared/**"
category = "separate_module"
target_module = "Shared"
reason = "Shared runtime content must migrate into its own independently authorized module"

[[repositories]]
source_url = "https://github.com/example-org/games-monorepo.git"
source_subdir = "Chess"
module_name = "Chess"
mount_path = "Chess"
lfs_mode = "hydrate"
submodule_policy = "record_gitlink"
expected_default_branch = "main"

[repositories.auth]
auth_method = "https_token"
token_env = "GITHUB_IMPORT_TOKEN"

